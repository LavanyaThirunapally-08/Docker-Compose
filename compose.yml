Services:
 bus_ticket_booking:
 container_name: bus-cont
 build: ./bus
 ports:
  - "1111:80"
  networks:
   - bus-network

flight_ticket_booking:
 container_name: flight-cont
 build: ./flight
 ports:
  - "2222:80"
  networks:
   - flight-network

 movie_ticket_booking:
  container_name: bus-cont
  build: ./movie
  ports:
   - "3333:80"
  networks:
   - movie-network
   
networks:
 bus-network:
  driver: bridge
 flight-network:
  driver: bridge
 movie-network:
  driver: bridge
